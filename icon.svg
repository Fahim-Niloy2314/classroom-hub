<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Graduation Cap Icon in White -->
  <g transform="translate(64, 80) scale(0.75)" fill="#ffffff">
    <!-- Cap Rhombus Top -->
    <polygon points="256,60 480,180 256,300 32,180" />
    
    <!-- Cap Skull Base -->
    <path d="M100,225 L100,340 C100,340 160,420 256,420 C352,420 412,340 412,340 L412,225 L256,310 Z" opacity="0.95" />
    
    <!-- Tassel Ribbon & Bobble -->
    <path d="M430,200 L450,330" stroke="#fcd34d" stroke-width="12" stroke-linecap="round" />
    <circle cx="452" cy="350" r="22" fill="#fbbf24" />
  </g>
  
  <!-- Subtle Badge Text ME '20 -->
  <text x="256" y="450" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="bold" fill="#ffffff" opacity="0.85" letter-spacing="4">ME '20</text>
</svg>
